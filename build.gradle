plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
}

group = 'io.github.alreadybold'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Discord API 래퍼 - 유저별 분리된 PCM 오디오 수신(handleUserAudio)을 공식 지원
    implementation 'net.dv8tion:JDA:6.7.0'

    // .env 파일에서 토큰/API 키 등 시크릿을 읽기 위한 라이브러리
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    // JDA는 SLF4J API에 로그를 남기므로, 실제로 로그를 보려면 구현체가 필요함
    implementation 'org.slf4j:slf4j-api:2.0.19'
    implementation 'ch.qos.logback:logback-classic:1.6.3'
}

application {
    mainClass = 'io.github.alreadybold.translator.Main'
}

checkstyle {
    toolVersion = '10.20.2'
    configFile = file('config/checkstyle/checkstyle.xml')
    // 컨벤션 위반이 아직 빌드를 막지는 않고, 리포트로만 확인 (config/checkstyle/checkstyle.xml의 severity=warning과 동일한 취지)
    ignoreFailures = true
    maxWarnings = Integer.MAX_VALUE
}

tasks.named('test') {
    useJUnitPlatform()
}
