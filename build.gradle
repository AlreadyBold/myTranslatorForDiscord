plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
}

group = 'io.github.alreadybold'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // libdave-jvm(DAVE 프로토콜 구현체)이 배포되는 저장소 - Maven Central엔 없음
    maven {
        url 'https://maven.lavalink.dev/snapshots'
    }
}

dependencies {
    // Discord API 래퍼 - 유저별 분리된 PCM 오디오 수신(handleUserAudio)을 공식 지원
    implementation 'net.dv8tion:JDA:6.7.0'

    // .env 파일에서 토큰/API 키 등 시크릿을 읽기 위한 라이브러리
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    // JDA는 SLF4J API에 로그를 남기므로, 실제로 로그를 보려면 구현체가 필요함
    implementation 'org.slf4j:slf4j-api:2.0.19'
    implementation 'ch.qos.logback:logback-classic:1.6.3'

    // DAVE(음성/영상 종단간 암호화) 프로토콜 구현체.
    // 디스코드가 2026-03-01부터 이 프로토콜 없는 음성 연결을 전부 거부하기 시작했고,
    // JDA는 인터페이스만 제공하고 실제 구현은 안 갖고 있어서 별도로 붙여야 함.
    implementation 'moe.kyokobot.libdave:adapter-jda:ce725965e'
    implementation 'moe.kyokobot.libdave:impl-jni:ce725965e'
    // 네이티브(JNI) 라이브러리 - 실행 시에만 필요해서 runtimeOnly로 최소화
    runtimeOnly 'moe.kyokobot.libdave:natives-darwin:ce725965e'

    // STT - 영어/중국어/일본어 입력 인식 (Azure Speech). 네이티브 라이브러리가 jar 안에
    // 이미 포함돼 있어서 libdave처럼 별도 natives 의존성을 안 받아도 됨.
    //
    // 이 좌표는 기본 패키징이 aar(안드로이드용)라, 그냥 버전만 쓰면 Gradle이 aar를 받아와서
    // 클래스가 하나도 안 잡힌다. 같은 버전에 순수 jar도 같이 배포돼 있어서, artifact 블록으로
    // 명시적으로 jar를 지정해서 받는다 (@jar 축약형은 전이 의존성까지 꺼버려서 안 씀).
    implementation('com.microsoft.cognitiveservices.speech:client-sdk:1.51.2') {
        artifact {
            name = 'client-sdk'
            type = 'jar'
            extension = 'jar'
        }
    }
}

application {
    mainClass = 'io.github.alreadybold.translator.Main'
}

checkstyle {
    toolVersion = '10.20.2'
    configFile = file('config/checkstyle/checkstyle.xml')
    // 컨벤션 위반이 아직 빌드를 막지는 않고, 리포트로만 확인 (config/checkstyle/checkstyle.xml의 severity=warning과 동일한 취지)
    ignoreFailures = true
    maxWarnings = Integer.MAX_VALUE
}

tasks.named('test') {
    useJUnitPlatform()
}
